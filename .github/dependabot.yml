version: 2

# One combined PR per week covering every ecosystem and update type.
multi-ecosystem-groups:
  weekly-all:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-all

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-all
